<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAC App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fe2c55">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;height:100dvh;overflow:hidden}
/* LOGIN WHITE LIKE TIKTOK */
.login{position:fixed;inset:0;z-index:100;background:#fff;color:#000;display:flex;flex-direction:column}
.login.hidden{display:none}
.login-title{font-size:22px;font-weight:900;text-align:center;padding:20px}
.login-sub{font-size:14px;color:#666;text-align:center;padding:0 20px 20px}
.tiktok-btn{width:90%;margin:0 auto 12px;border:1px solid #ddd;border-radius:4px;padding:13px;display:flex;align-items:center;gap:12px;font-weight:700;background:#fff;color:#000;cursor:pointer}
.tiktok-btn.primary{background:#fe2c55;color:#fff;border-color:#fe2c55}
.or{display:flex;align-items:center;gap:10px;padding:15px;color:#999;font-size:12px;width:90%;margin:0 auto}
.or::before,.or::after{content:'';flex:1;height:1px;background:#eee}
.signup{margin-top:auto;padding:20px;text-align:center;border-top:1px solid #eee;background:#fafafa}
.signup b{color:#fe2c55}
/* MAIN APP BLACK RED */
.header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;padding:10px;background:linear-gradient(to bottom,black,transparent)}
.logo{font-weight:900}
.logo span{color:#fe2c55}
.feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory}
.v-card{height:100dvh;scroll-snap-align:start;position:relative}
.v-card video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;background:linear-gradient(to top,black,transparent 40%)}
.right{position:absolute;right:8px;bottom:110px;display:flex;flex-direction:column;gap:15px;text-align:center}
.act i{width:44px;height:44px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.left{position:absolute;left:10px;bottom:90px;right:70px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:black;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0 15px}
.nav{color:#555;font-size:9px;font-weight:700;text-align:center}
.nav.active{color:white}
.nav i{font-size:18px;display:block}
.modal{position:fixed;inset:0;z-index:200;background:white;color:black;display:none;flex-direction:column}
.modal.show{display:flex}
.input{width:100%;padding:14px;border:1px solid #ddd;background:#f5f5f5;margin-bottom:10px}
.btn{width:100%;padding:14px;background:#fe2c55;color:white;border:none;font-weight:800}
.status{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:#fe2c55;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:800;display:none;z-index:30}
.status.show{display:block}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login">
  <div style="padding:14px;display:flex;justify-content:space-between"><i class="fa-solid fa-xmark" onclick="continueAsGuest()"></i><i class="fa-solid fa-circle-question"></i></div>
  <div class="login-title">Log in to PAC App</div>
  <div class="login-sub">TikTok for Campus - Logo #1 Glitch Shield Red</div>
  <button class="tiktok-btn" onclick="openPhone()"><i class="fa-solid fa-user"></i> Use phone / email / username</button>
  <button class="tiktok-btn" onclick="socialLogin('Facebook')"><i class="fa-brands fa-facebook" style="color:blue"></i> Continue with Facebook</button>
  <button class="tiktok-btn" onclick="socialLogin('Google')"><i class="fa-brands fa-google" style="color:red"></i> Continue with Google</button>
  <div class="or">OR</div>
  <button class="tiktok-btn" onclick="continueAsGuest()" style="width:90%;margin:0 auto"><i class="fa-solid fa-user-secret"></i> Continue as guest</button>
  <div class="signup">Don't have account? <b>Sign up</b></div>
</div>

<!-- PHONE LOGIN -->
<div id="phoneModal" class="modal">
  <div style="padding:14px;border-bottom:1px solid #eee"><i class="fa-solid fa-arrow-left" onclick="closePhone()"></i> <span style="margin-left:40px;font-weight:700">Log in</span></div>
  <div style="padding:20px"><input id="phoneInput" placeholder="Phone UG +256" class="input"><input id="passInput" type="password" placeholder="Password" class="input"><button id="loginBtn" class="btn" disabled onclick="doLogin()">Log in</button></div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none">
  <div class="header"><div class="logo">PAC <span>App</span> 🔴 Logo #1</div><div id="userDisplay" style="font-size:11px">@guest</div></div>
  <div id="status" class="status"></div>
  <div id="feed" class="feed"></div>
  <div class="bottom"><div class="nav active"><i class="fa-solid fa-house"></i>Home</div><div class="nav"><i class="fa-solid fa-compass"></i>Discover</div><div class="nav" style="background:#fe2c55;color:white;width:40px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center">+</div><div class="nav"><i class="fa-solid fa-inbox"></i>Inbox</div><div class="nav" onclick="logout()"><i class="fa-solid fa-user"></i>Profile</div></div>
</div>

<script>
let currentUser=JSON.parse(localStorage.getItem('pac_user'))||null;
const POOL=[
{url:'https://www.w3schools.com/html/mov_bbb.mp4',user:'@pacstudentlife',desc:'Welcome PAC App Red Logo #1 Glitch Shield 🔥 #FYP'},
{url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',user:'@makerere',desc:'Makerere FREE streaming #Makerere'},
{url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',user:'@mubs',desc:'MUBS life #MUBS'},
];
let videos=JSON.parse(localStorage.getItem('pac_final'))||POOL;
function show(t){let e=document.getElementById('status');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500);}
function render(){document.getElementById('feed').innerHTML=videos.map((v,i)=>`<div class="v-card"><video src="${v.url}" loop autoplay muted playsinline onclick="this.muted=!this.muted"></video><div class="overlay"></div><div class="right"><div class="act"><img src="https://i.pravatar.cc/100?img=${i+5}" style="width:44px;height:44px;border-radius:50%;border:2px solid white"><br>+</div><div class="act"><i class="fa-solid fa-heart"></i><br>12K</div><div class="act"><i class="fa-solid fa-comment-dots"></i><br>312</div><div class="act"><i class="fa-solid fa-share"></i><br>Share</div></div><div class="left"><div style="font-weight:800">${v.user} ✅</div><div style="font-size:13px;margin-top:4px">${v.desc} • Logo #1 Red</div></div></div>`).join('');}
function checkLogin(){if(currentUser){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').style.display='block';document.getElementById('userDisplay').textContent='@'+currentUser.name;render();}}
function openPhone(){document.getElementById('phoneModal').classList.add('show');}
function closePhone(){document.getElementById('phoneModal').classList.remove('show');}
document.getElementById('phoneInput').addEventListener('input',()=>{document.getElementById('loginBtn').disabled=!(phoneInput.value.length>4&&passInput.value.length>2);});
document.getElementById('passInput').addEventListener('input',()=>{document.getElementById('loginBtn').disabled=!(phoneInput.value.length>4&&passInput.value.length>2);});
function doLogin(){let u={name:phoneInput.value.slice(-6)||'pac_user'};localStorage.setItem('pac_user',JSON.stringify(u));currentUser=u;closePhone();checkLogin();show('✅ Logged in @'+u.name);}
function socialLogin(p){let u={name:p.toLowerCase()+'_123'};localStorage.setItem('pac_user',JSON.stringify(u));currentUser=u;checkLogin();show('✅ Logged with '+p);}
function continueAsGuest(){let u={name:'guest_'+Math.floor(Math.random()*1000)};localStorage.setItem('pac_user',JSON.stringify(u));currentUser=u;checkLogin();}
function logout(){localStorage.removeItem('pac_user');location.reload();}
function autoAdd(){let r=POOL[Math.floor(Math.random()*POOL.length)];if(videos[0].url===r.url)return;videos.unshift(r);if(videos.length>30)videos.pop();localStorage.setItem('pac_final',JSON.stringify(videos));render();show('🤖 AUTO Added '+r.user);}
checkLogin();render();setInterval(autoAdd,12000);show('🔴 PAC App LIVE - Logo #1 Glitch Red!');
</script>
</body>
</html>
